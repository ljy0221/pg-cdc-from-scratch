services:
  pg-source:
    image: postgres:16
    container_name: pg-source
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: source
    ports:
      - "5433:5432"
    volumes:
      - pg_source_data:/var/lib/postgresql/data
    command: 
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10

  pg-sink:
    image: postgres:16
    container_name: pg-sink
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sink
    ports:
      - "5434:5432"
    volumes:
      - pg_sink_data:/var/lib/postgresql/data
  
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "9092:9092"

volumes:
  pg_source_data:
  pg_sink_data: